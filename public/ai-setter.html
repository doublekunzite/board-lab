<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Setter | Board Lab</title>
    <!-- Global Styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png?v=2" type="image/png">
    
    <style>
        /* ============================================
           PAGE LAYOUT & SIDEBAR
           ============================================ */
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color, #f4f4f4);
            color: var(--text-color, #333);
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--panel-bg, #fff);
            padding: 2rem;
            border-right: 1px solid var(--border-color, #ddd);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            z-index: 20;
            flex-shrink: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar h2 {
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--accent-color, #007bff);
            padding-bottom: 0.5rem;
            font-family: Impact, 'Arial Narrow Bold', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group label {
            font-weight: 600;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .control-group input, 
        .control-group select {
            padding: 0.75rem;
            border: 1px solid var(--border-color, #ccc);
            border-radius: 6px;
            font-size: 1rem;
            background: var(--input-bg, #fff);
            color: inherit;
        }

        .btn-generate {
            background-color: var(--accent-color, #007bff);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-generate:hover { opacity: 0.9; }
        .btn-generate:disabled { background-color: #ccc; cursor: not-allowed; }

        .status-area {
            padding: 1rem;
            background: var(--status-bg, #eef2f7);
            border-radius: 6px;
            font-size: 0.9rem;
            min-height: 60px;
            line-height: 1.4;
        }
        .status-error { color: #dc3545; font-weight: bold; }
        .status-success { color: #28a745; font-weight: bold; }

        /* Legend */
        .legend {
            margin-top: auto;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color, #eee);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* ============================================
           BOARD CONTAINER (Copied from board-layout.html)
           ============================================ */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: #e9ecef; /* Distinct background */
            overflow: auto;
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px; /* Same as original */
            margin: 0 auto;
            background: #111;
            border-radius: 8px;
            overflow: visible; /* Allow tooltips if we add them later */
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .board-image {
            width: 100%; 
            height: auto; 
            display: block; 
            opacity: 0.8; 
            border-radius: 8px;
        }

        .grid-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(17, 1fr);
            grid-template-rows: repeat(18, 1fr);
            overflow: visible;
        }

        /* The Grid Cells */
        .hold-cell {
            position: relative; 
            border: 1px solid rgba(255,255,255,0.05);
            cursor: default; /* Not clickable like the map page */
            transition: background 0.2s; 
            z-index: 1;
        }

        /* ============================================
           AI PROBLEM VISUALIZATION (Circles)
           ============================================ */
        
        /* The Circle Marker (Centered in cell) */
        .hold-cell::after {
            content: ''; 
            position: absolute; 
            /* Positioning logic to center a circle */
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            
            width: 18px; 
            height: 18px;
            border-radius: 50%;
            
            /* Default state: invisible */
            opacity: 0; 
            background: transparent;
            
            /* Animation */
            transition: opacity 0.2s, background 0.2s, box-shadow 0.2s;
        }

        /* ACTIVE STATES (Colors) */
        
        /* 1. Start: Green */
        .hold-cell.is-start::after {
            opacity: 1;
            background-color: #4ade80; /* Green 400 */
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
            z-index: 10;
        }

        /* 2. Intermediate (Hands): Teal */
        .hold-cell.is-hand::after {
            opacity: 1;
            background-color: #2dd4bf; /* Teal 400 */
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 0 4px rgba(45, 212, 191, 0.4);
        }

        /* 3. Feet: Yellow */
        .hold-cell.is-feet::after {
            opacity: 1;
            background-color: #facc15; /* Yellow 400 */
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 0 4px rgba(250, 204, 21, 0.4);
        }

        /* 4. Finish: Purple */
        .hold-cell.is-finish::after {
            opacity: 1;
            background-color: #a855f7; /* Purple 500 */
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
            z-index: 10;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1.5rem; color: white;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .loading-overlay.active { opacity: 1; pointer-events: all; }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid var(--accent-color, #fff);
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>AI Setter</h2>
        <p style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 1rem;">Generate boulder problems using AI.</p>

        <div class="control-group">
            <label for="userHeight">User Height (cm)</label>
            <input type="number" id="userHeight" value="175" min="150" max="200">
        </div>

        <div class="control-group">
            <label for="styleSelect">Climbing Style</label>
            <select id="styleSelect">
                <option value="Static/Technical">Static / Technical</option>
                <option value="Powerful/Dynamic">Powerful / Dynamic</option>
                <option value="Compression">Compression</option>
                <option value="Crimp Strength">Crimp Strength</option>
                <option value="Random">Surprise Me</option>
            </select>
			
			<div class="control-group">
            <label for="gradeSelect">Difficulty</label>
            <select id="gradeSelect">
                <option value="Easy">Easy</option>
                <option value="Medium" selected>Medium</option>
                <option value="Hard">Hard</option>
            </select>
        </div>
			
        </div>

        <button id="generateBtn" class="btn-generate">Generate Problem</button>
        <button id="clearBtn" class="btn-generate" style="background-color: #6c757d; margin-top: -0.5rem;">Clear Board</button>

        <div id="statusArea" class="status-area">
            Ready to set.
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:#4ade80;"></div> Start</div>
            <div class="legend-item"><div class="legend-dot" style="background:#a855f7;"></div> Finish</div>
            <div class="legend-item"><div class="legend-dot" style="background:#2dd4bf;"></div> Hands</div>
            <div class="legend-item"><div class="legend-dot" style="background:#facc15;"></div> Feet</div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="board-wrapper" id="boardWrapper">
            <img src="board-layout.png" alt="Kilter Board Layout" class="board-image">
            <div class="grid-overlay" id="gridOverlay">
                <!-- Grid cells generated by JS -->
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div>Setting Problem...</div>
    </div>

    <script>
        // --- Configuration ---
        const HOLDS_FILE = 'holds.json';
        const API_ENDPOINT = '/api/generate-problem';
        
        // --- State ---
        let holdsData = {}; 

        // --- DOM Elements ---
        const gridOverlay = document.getElementById('gridOverlay');
        const generateBtn = document.getElementById('generateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusArea = document.getElementById('statusArea');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const heightInput = document.getElementById('userHeight');
        const styleInput = document.getElementById('styleSelect');
        const gradeInput = document.getElementById('gradeSelect'); // NEW

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            try {
                statusArea.innerText = "Loading board data...";
                const response = await fetch(HOLDS_FILE);
                if (!response.ok) throw new Error("Could not load holds.json");
                holdsData = await response.json();
                
                renderGrid();
                statusArea.innerText = "Ready to set.";
            } catch (err) {
                statusArea.innerHTML = `<span class="status-error">Error: ${err.message}</span>`;
            }
        }

        // --- Render Logic (Mirrors board-layout.html) ---
        function renderGrid() {
            gridOverlay.innerHTML = '';
            const columns = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'P', 'Q'];

            // Render from Row 18 down to 1 (Visual top to bottom)
            for (let r = 18; r >= 1; r--) {
                // Render from Col A to Q (Left to Right)
                for (let c = 0; c < 17; c++) {
                    const colLetter = columns[c];
                    const holdId = `${colLetter}${r}`;
                    
                    const cell = document.createElement('div');
                    cell.className = 'hold-cell';
                    cell.dataset.id = holdId; // Store ID for easy selection
                    
                    gridOverlay.appendChild(cell);
                }
            }
        }

        function clearBoardVisuals() {
            // Remove all color classes from cells
            document.querySelectorAll('.hold-cell').forEach(cell => {
                cell.classList.remove('is-start', 'is-hand', 'is-feet', 'is-finish');
            });
        }

         // --- API Interaction ---
        generateBtn.addEventListener('click', async () => {
            clearBoardVisuals();
            statusArea.innerText = "Contacting AI...";
            loadingOverlay.classList.add('active');
            generateBtn.disabled = true;

            try {
                const payload = {
                    holdsMap: holdsData,
                    userHeight: parseInt(heightInput.value),
                    style: styleInput.value,
                    grade: gradeInput.value // NEW
                };

                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    if (result.warning) {
                        statusArea.innerHTML = `<span class="status-error">Warning:</span> ${result.warning}`;
                    } else {
                        statusArea.innerHTML = `<span class="status-success">Problem generated!</span>`;
                    }
                    renderProblem(result);
                } else {
                    throw new Error(result.error || "Server error");
                }

            } catch (err) {
                statusArea.innerHTML = `<span class="status-error">Error: ${err.message}</span>`;
            } finally {
                loadingOverlay.classList.remove('active');
                generateBtn.disabled = false;
            }
        });

        clearBtn.addEventListener('click', () => {
            clearBoardVisuals();
            statusArea.innerText = "Board cleared.";
        });

        // --- Visualization Helper ---
        function renderProblem(data) {
            // Helper to find a cell and add a class
            const lightUp = (ids, className) => {
                if (!ids) return;
                ids.forEach(id => {
                    // Find the cell by data-id
                    const cell = gridOverlay.querySelector(`[data-id="${id}"]`);
                    if (cell) {
                        cell.classList.add(className);
                    }
                });
            };

            // 1. Start (Green)
            if (data.start) lightUp(data.start, 'is-start');
            
            // 2. Finish (Purple)
            if (data.finish) lightUp(data.finish, 'is-finish');
            
            // 3. Intermediates (Teal)
            if (data.intermediate) lightUp(data.intermediate, 'is-hand');
            
            // 4. Feet (Yellow)
            if (data.feet) lightUp(data.feet, 'is-feet');

            // Legacy/Backup: Handle flat sequence if backend doesn't categorize
            if (data.sequence && Array.isArray(data.sequence)) {
                if (data.sequence.length > 0) lightUp([data.sequence[0]], 'is-start');
                if (data.sequence.length > 1) lightUp([data.sequence[data.sequence.length - 1]], 'is-finish');
                if (data.sequence.length > 2) lightUp(data.sequence.slice(1, -1), 'is-hand');
            }
        }
    </script>
</body>
</html>
