<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Setter | Board Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png?v=2" type="image/png">

    <style>
        /* ============================================
           AI SETTER DARK THEME
           ============================================ */

        .ai-setter-page {
            display: flex;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Floating holds background (optional, subtle) */
        .ai-setter-page .bg-atmosphere,
        .ai-setter-page .noise-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            padding: 2rem;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            z-index: 20;
            flex-shrink: 0;
            height: 100vh;
            overflow-y: auto;
            position: relative;
        }

        .sidebar h2 {
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 0.5rem;
            font-family: Impact, 'Arial Narrow Bold', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: var(--fg);
        }

        .sidebar > p {
            font-size: 0.95rem;
            opacity: 0.7;
            margin-bottom: 0;
            color: var(--fg-muted);
            line-height: 1.5;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--fg-muted);
        }

        .control-group input, 
        .control-group select {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            background: rgba(255,255,255,0.05);
            color: var(--fg);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255, 176, 136, 0.2);
        }

        .btn-generate {
            background-color: var(--accent);
            color: var(--bg);
            padding: 1rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-generate:hover:not(:disabled) { 
            opacity: 0.9; 
            transform: translateY(-1px);
        }

        .btn-generate:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-generate:disabled { 
            background-color: var(--border); 
            color: var(--fg-muted);
            cursor: not-allowed; 
            opacity: 0.5; 
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--fg-muted);
            border: 1px solid var(--border);
            margin-top: -0.5rem;
        }

        .btn-secondary:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--fg);
            opacity: 1;
        }

        .status-area {
            padding: 1rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            min-height: 80px;
            line-height: 1.6;
            word-break: break-word;
            color: var(--fg-muted);
        }

        .status-area strong {
            font-size: 1.05rem;
            display: block;
            margin-bottom: 0.25rem;
            color: var(--fg);
        }

        .status-area span {
            display: block;
        }

        .status-error { 
            color: #ff6b6b; 
            font-weight: 600; 
        }

        .status-success { 
            color: #51cf66; 
            font-weight: 600; 
        }

        .status-beta {
            font-size: 0.85rem;
            opacity: 0.75;
            font-style: italic;
            margin-top: 0.25rem;
            display: block;
        }

        .status-area details {
            margin-top: 0.5rem;
        }

        .status-area summary {
            color: #ff6b6b;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .status-area ul {
            margin: 0.5rem 0 0 1.2rem;
            padding: 0;
            font-size: 0.85rem;
            color: #ff6b6b;
        }

        .status-selection-hint {
            font-size: 0.85rem;
            opacity: 0.6;
            margin-top: 0.25rem;
            display: block;
        }

        .legend {
            margin-top: auto;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--fg-muted);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .legend-outline {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px dashed;
            background: transparent;
            flex-shrink: 0;
        }

        /* Main content area */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: var(--bg);
            overflow: auto;
            position: relative;
            z-index: 1;
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #0a0a0a;
            border-radius: 8px;
            overflow: visible;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .board-image {
            width: 100%; 
            height: auto; 
            display: block; 
            opacity: 0.85; 
            border-radius: 8px;
        }

        .grid-overlay {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            display: grid;
            grid-template-columns: repeat(17, 1fr);
            grid-template-rows: repeat(18, 1fr);
            overflow: visible;
        }

        .hold-cell {
            position: relative; 
            border: 1px solid rgba(255,255,255,0.06);
            cursor: default;
            transition: background 0.2s; 
            z-index: 1;
        }

        .hold-cell.has-hold {
            cursor: pointer;
        }

        .hold-cell.has-hold:hover {
            background: rgba(255,255,255,0.08);
        }

        /* User selection: dashed outlines */
        .hold-cell.selected-start {
            outline: 2px dashed #4ade80;
            outline-offset: 1px;
            z-index: 5;
        }

        .hold-cell.selected-finish {
            outline: 2px dashed #a855f7;
            outline-offset: 1px;
            z-index: 5;
        }

        /* AI result: filled circles */
        .hold-cell::after {
            content: ''; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 18px; 
            height: 18px;
            border-radius: 50%;
            opacity: 0; 
            background: transparent;
            transition: opacity 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .hold-cell.is-start::after {
            opacity: 1;
            background-color: #4ade80;
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
            z-index: 10;
        }

        .hold-cell.is-hand::after {
            opacity: 1;
            background-color: #2dd4bf;
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 0 4px rgba(45, 212, 191, 0.4);
        }

        .hold-cell.is-feet::after {
            opacity: 1;
            background-color: #facc15;
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 0 4px rgba(250, 204, 21, 0.4);
        }

        .hold-cell.is-finish::after {
            opacity: 1;
            background-color: #a855f7;
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
            z-index: 10;
        }

        /* Hold tooltip */
        .hold-cell[data-info]::before {
            content: attr(data-info);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 100;
            margin-bottom: 4px;
            border: 1px solid var(--border);
        }

        .hold-cell[data-info]:hover::before {
            opacity: 1;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px); 
            z-index: 1000;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 1.5rem; 
            color: var(--fg);
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.3s;
        }

        .loading-overlay.active { 
            opacity: 1; 
            pointer-events: all; 
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 50px; 
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

.ai-setter-page .header-inner {
    padding-left: 360px;
}

@media (max-width: 900px) {
    .ai-setter-page .header-inner {
        padding-left: 2rem;
    }
}

        /* Responsive */
        @media (max-width: 900px) {
            .ai-setter-page {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 50vh;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
<base target="_blank">
</head>
<body class="ai-setter-page">
    <div class="bg-atmosphere" aria-hidden="true"></div>
    <div class="noise-overlay" aria-hidden="true"></div>

    <!-- Header -->
    <header class="site-header" id="siteHeader" style="position: fixed; top: 0; left: 0; right: 0; z-index: 100;">
        <div class="header-inner">
            <a href="index.html" class="logo font-display">BOARD LAB</a>
            <nav>
                <ul class="nav-links"></ul>
            </nav>
        </div>
    </header>

    <!-- Spacer for fixed header -->
    <div style="height: 60px; flex-shrink: 0;"></div>

    <aside class="sidebar">
        <h2>AI Setter</h2>
        <p>Click holds on the board to set start & finish, then generate.</p>

        <div class="control-group">
            <label for="userHeight">User Height (cm)</label>
            <input type="number" id="userHeight" value="175" min="150" max="200">
        </div>

        <div class="control-group">
            <label for="styleSelect">Climbing Style</label>
            <select id="styleSelect">
                <option value="Static/Technical">Static / Technical</option>
                <option value="Powerful/Dynamic">Powerful / Dynamic</option>
                <option value="Compression">Compression</option>
                <option value="Crimp Strength">Crimp Strength</option>
                <option value="Random">Surprise Me</option>
            </select>
        </div>

        <div class="control-group">
            <label for="gradeSelect">Difficulty</label>
            <select id="gradeSelect">
                <option value="Easy">Easy</option>
                <option value="Medium" selected>Medium</option>
                <option value="Hard">Hard</option>
            </select>
        </div>

        <button id="generateBtn" class="btn-generate" disabled>Generate Problem</button>
        <button id="clearBtn" class="btn-generate btn-secondary">Clear All</button>

        <div id="statusArea" class="status-area">
            Loading board data...
        </div>

        <div class="legend">
            <div class="legend-item"><div class="legend-outline" style="border-color:#4ade80;"></div> Start (yours)</div>
            <div class="legend-item"><div class="legend-outline" style="border-color:#a855f7;"></div> Finish (yours)</div>
            <div class="legend-item"><div class="legend-dot" style="background:#4ade80;"></div> Start (AI)</div>
            <div class="legend-item"><div class="legend-dot" style="background:#a855f7;"></div> Finish (AI)</div>
            <div class="legend-item"><div class="legend-dot" style="background:#2dd4bf;"></div> Hands</div>
            <div class="legend-item"><div class="legend-dot" style="background:#facc15;"></div> Feet</div>
        </div>
    </aside>

    <main class="main-content">
        <div class="board-wrapper" id="boardWrapper">
            <img src="board-layout.png" alt="Kilter Board Layout" class="board-image">
            <div class="grid-overlay" id="gridOverlay"></div>
        </div>
    </main>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div>Setting Problem...</div>
    </div>

    <script>
        const HOLDS_FILE = 'holds.json';
        const API_ENDPOINT = '/api/generate-problem';

        // --- State ---
        let holdsData = {};
        let selectedStarts = [];
        let selectedFinish = null;

        // --- DOM ---
        const gridOverlay = document.getElementById('gridOverlay');
        const generateBtn = document.getElementById('generateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusArea = document.getElementById('statusArea');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const heightInput = document.getElementById('userHeight');
        const styleInput = document.getElementById('styleSelect');
        const gradeInput = document.getElementById('gradeSelect');

        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            try {
                statusArea.innerHTML = "Loading board data...";
                const response = await fetch(HOLDS_FILE);
                if (!response.ok) throw new Error("Could not load holds.json");
                holdsData = await response.json();
                renderGrid();
                updateSelectionUI();
            } catch (err) {
                statusArea.innerHTML = `<span class="status-error">Error: ${err.message}</span>`;
            }
        }

        // --- Grid Rendering ---
        function renderGrid() {
            gridOverlay.innerHTML = '';
            const columns = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','Q'];

            for (let r = 18; r >= 1; r--) {
                for (let c = 0; c < 17; c++) {
                    const colLetter = columns[c];
                    const holdId = `${colLetter}${r}`;
                    const hold = holdsData[holdId];

                    const cell = document.createElement('div');
                    cell.className = 'hold-cell';
                    cell.dataset.id = holdId;

                    if (hold) {
                        cell.classList.add('has-hold');
                        const typeStr = Array.isArray(hold.type) ? hold.type.join('/') : hold.type;
                        cell.dataset.info = `${holdId} | ${typeStr} | ${hold.grade || 'N/A'} | ${hold.angleCategory || 'N/A'}`;
                    }

                    gridOverlay.appendChild(cell);
                }
            }
        }

        // --- Selection Logic ---
        gridOverlay.addEventListener('click', (e) => {
            const cell = e.target.closest('.hold-cell');
            if (!cell || !cell.classList.contains('has-hold')) return;

            const holdId = cell.dataset.id;
            const hold = holdsData[holdId];
            if (!hold) return;

            const maxReach = Math.floor(0.75 * parseInt(heightInput.value) / 15);

            if (hold.row <= 6) {
                handleStartClick(holdId, hold, cell, maxReach);
            } else if (hold.row >= 16) {
                handleFinishClick(holdId, cell);
            } else {
                statusArea.innerHTML = `<span class="status-error">Click holds in the bottom 6 rows (start) or top 3 rows (finish).</span>`;
                setTimeout(updateSelectionUI, 2000);
            }
        });

        function handleStartClick(holdId, hold, cell, maxReach) {
            if (selectedStarts.includes(holdId)) {
                selectedStarts = selectedStarts.filter(id => id !== holdId);
                cell.classList.remove('selected-start');
            } else if (selectedStarts.length >= 2) {
                statusArea.innerHTML = `<span class="status-error">Max 2 start holds. Click a selected start to remove it first.</span>`;
                setTimeout(updateSelectionUI, 2000);
                return;
            } else {
                if (selectedStarts.length === 1) {
                    const existing = holdsData[selectedStarts[0]];
                    const dist = Math.sqrt(Math.pow(existing.row - hold.row, 2) + Math.pow(existing.col - hold.col, 2));
                    if (dist > maxReach) {
                        statusArea.innerHTML = `<span class="status-error">Too far from other start hold (${dist.toFixed(1)} units vs max ${maxReach}).</span>`;
                        setTimeout(updateSelectionUI, 2000);
                        return;
                    }
                }
                selectedStarts.push(holdId);
                cell.classList.add('selected-start');
            }
            updateSelectionUI();
        }

        function handleFinishClick(holdId, cell) {
            if (selectedFinish === holdId) {
                selectedFinish = null;
                cell.classList.remove('selected-finish');
            } else {
                if (selectedFinish) {
                    const prevCell = gridOverlay.querySelector(`[data-id="${selectedFinish}"]`);
                    if (prevCell) prevCell.classList.remove('selected-finish');
                }
                selectedFinish = holdId;
                cell.classList.add('selected-finish');
            }
            updateSelectionUI();
        }

        function updateSelectionUI() {
            const sc = selectedStarts.length;
            const hasFinish = !!selectedFinish;

            let html = '';

            if (sc === 0) {
                html = '<strong>Step 1: Select Start Holds</strong>';
                html += '<span>Click 1–2 holds in the bottom 6 rows (rows 1–6).</span>';
                html += '<span class="status-selection-hint">Green dashed outline = your selection</span>';
            } else if (!hasFinish) {
                html = `<strong>Step 2: Select Finish Hold</strong>`;
                html += `<span>${sc} start hold${sc > 1 ? 's' : ''} selected. Now click 1 hold in the top 3 rows (rows 16–18).</span>`;
                html += '<span class="status-selection-hint">Click a selected start hold to remove it</span>';
            } else {
                const startMaxRow = Math.max(...selectedStarts.map(id => holdsData[id]?.row || 0));
                const finishHold = holdsData[selectedFinish];
                if (finishHold && (finishHold.row - startMaxRow) <= 2) {
                    html = '<span class="status-error">Start and finish are too close together. Move start down or finish higher.</span>';
                    generateBtn.disabled = true;
                    statusArea.innerHTML = html;
                    return;
                }
                html = '<strong>Ready</strong>';
                html += `<span>${sc} start + 1 finish selected. Adjust settings and click Generate.</span>`;
                html += '<span class="status-selection-hint">Click holds to adjust selection. Purple dashed = finish.</span>';
            }

            generateBtn.disabled = !(sc >= 1 && hasFinish);
            statusArea.innerHTML = html;
        }

        function clearSelections() {
            selectedStarts.forEach(id => {
                const cell = gridOverlay.querySelector(`[data-id="${id}"]`);
                if (cell) cell.classList.remove('selected-start');
            });
            if (selectedFinish) {
                const cell = gridOverlay.querySelector(`[data-id="${selectedFinish}"]`);
                if (cell) cell.classList.remove('selected-finish');
            }
            selectedStarts = [];
            selectedFinish = null;
        }

        function clearBoardVisuals() {
            document.querySelectorAll('.hold-cell').forEach(cell => {
                cell.classList.remove('is-start', 'is-hand', 'is-feet', 'is-finish');
            });
        }

        // --- API ---
        generateBtn.addEventListener('click', async () => {
            clearBoardVisuals();
            statusArea.innerHTML = "Contacting AI...";
            loadingOverlay.classList.add('active');
            generateBtn.disabled = true;

            try {
                const payload = {
                    holdsMap: holdsData,
                    userHeight: parseInt(heightInput.value),
                    style: styleInput.value,
                    grade: gradeInput.value,
                    start: selectedStarts,
                    finish: [selectedFinish]
                };

                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const errorText = await response.text();
                    throw new Error(`Server error (${response.status}): ${errorText.substring(0, 150)}`);
                }

                const result = await response.json();

                if (response.ok) {
                    renderProblem(result, selectedStarts, [selectedFinish]);
                } else {
                    throw new Error(result.error || `Server error ${response.status}`);
                }

            } catch (err) {
                statusArea.innerHTML = `<span class="status-error">Error: ${escapeHtml(err.message)}</span>`;
            } finally {
                loadingOverlay.classList.remove('active');
                updateSelectionUI();
            }
        });

        clearBtn.addEventListener('click', () => {
            clearBoardVisuals();
            clearSelections();
            updateSelectionUI();
        });

        // --- Render AI Result ---
        function renderProblem(data, userStarts, userFinish) {
            clearBoardVisuals();

            const lightUp = (ids, className) => {
                if (!ids) return;
                ids.forEach(id => {
                    const cell = gridOverlay.querySelector(`[data-id="${id}"]`);
                    if (cell) cell.classList.add(className);
                });
            };

            if (data.start) lightUp(data.start, 'is-start');
            if (data.intermediate) lightUp(data.intermediate, 'is-hand');
            if (data.finish) lightUp(data.finish, 'is-finish');
            if (data.feet) lightUp(data.feet, 'is-feet');

            let html = '';
            const totalHands = (data.start?.length || 0) + (data.intermediate?.length || 0) + (data.finish?.length || 0);

            html += `<span class="status-success">Problem generated: ${totalHands} hands, ${data.feet?.length || 0} feet</span>`;

            if (data.warning) {
                html += `<span class="status-error">${escapeHtml(data.warning)}</span>`;
            }

            const allMessages = [
                ...(data.errors || []),
                ...(data.feetWarnings || [])
            ];

            if (allMessages.length > 0) {
                html += `<details><summary>Warnings (${allMessages.length})</summary><ul>`;
                allMessages.forEach(msg => { html += `<li>${escapeHtml(msg)}</li>`; });
                html += `</ul></details>`;
            }

            statusArea.innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
    <script src="nav.js"></script>
</body>
</html>
