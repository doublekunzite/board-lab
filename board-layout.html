<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kilter Board Map | Board Lab</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* ============================================
       BOARD MAP SPECIFIC STYLES
       ============================================ */
    :root {
      --tier-1: #4ade80; /* Green - Good */
      --tier-2: #facc15; /* Yellow - Medium */
      --tier-3: #f87171; /* Red - Hard */
      --edge-color: #60a5fa; /* Blue - for Edge Size */
      
      /* Type Colors */
      --type-jug: #4ade80;
      --type-crimp: #facc15;
      --type-pinch: #f472b6;
      --type-sloper: #60a5fa;
	  --type-undercling: #a78bfa;
    }

    .board-page {
      position: relative;
      z-index: 10;
      padding: 8rem 2rem 4rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .board-header { text-align: center; margin-bottom: 2rem; }
    
    .page-title {
      font-family: Impact, 'Arial Narrow Bold', sans-serif;
      font-size: clamp(3rem, 8vw, 5rem);
      color: var(--fg);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    
    .page-subtitle {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

        /* Board Container - No padding needed, grid fills the space */
    .board-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background: #111;
      border-radius: 8px;
      overflow: visible; /* Allows labels to extend outside */
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .board-image {
      width: 100%; 
      height: auto; 
      display: block; 
      opacity: 0.8; 
      border-radius: 8px;
    }

    .grid-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: grid;
      grid-template-columns: repeat(17, 1fr);
      grid-template-rows: repeat(18, 1fr);
      overflow: visible; /* Critical for labels to be visible */
    }

    /* Increase gap between subtitle and the top labels */
    .board-header { 
      text-align: center; 
      margin-bottom: 3.5rem; /* Increased from 2rem for breathing room */
    }

    /* Large Labels - Outside Grid */
    .grid-label {
      position: absolute;
      font-size: 1rem; /* Big, clear text */
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      pointer-events: none;
      z-index: 10;
    }

    .col-label {
      top: 0;
      width: calc(100% / 17); /* Match column width */
      text-align: center;
      /* Move label entirely above the grid */
      transform: translateY(-100%); 
      padding-bottom: 0.5rem; /* Space between label and grid line */
    }

    .row-label {
      left: 0;
      height: calc(100% / 18); /* Match row height */
      display: flex;
      align-items: center;
      justify-content: flex-end; /* Align number to the right (towards grid) */
      /* Move label entirely left of the grid */
      transform: translateX(-100%);
      padding-right: 0.75rem; /* Space between label and grid line */
    }

    .hold-cell {
      position: relative; border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer; transition: background 0.2s; z-index: 1;
    }
    .hold-cell:hover { background: rgba(255,255,255,0.1); z-index: 100; }

    .hold-cell::after {
      content: ''; position: absolute; top: 5px; left: 5px; width: 12px; height: 12px;
      border-radius: 50%; opacity: 0; transition: opacity 0.3s; box-shadow: 0 0 5px currentColor;
    }
    .show-tiers .hold-cell::after { opacity: 0.9; }
    .hold-cell.tier-1::after { background: var(--tier-1); color: var(--tier-1); }
    .hold-cell.tier-2::after { background: var(--tier-2); color: var(--tier-2); }
    .hold-cell.tier-3::after { background: var(--tier-3); color: var(--tier-3); }

    .hold-tooltip {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); width: 180px;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem;
      pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 200;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .hold-cell:hover .hold-tooltip { opacity: 1; }
    .hold-cell.tooltip-below .hold-tooltip { bottom: auto; top: 100%; }
    .hold-cell.col-right .hold-tooltip { left: auto; right: 0; transform: translateX(0); }

    .tooltip-img { width: 100%; height: 100px; object-fit: contain; background: #222; border-radius: 4px; margin-bottom: 0.5rem; }
    .tooltip-info h4 { font-size: 1rem; color: var(--fg); margin-bottom: 0.25rem; }
    .tooltip-info p { font-size: 0.75rem; color: var(--fg-muted); }

    .tier-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-top: 0.25rem; }
    .tier-badge.t-1 { background: rgba(74, 222, 128, 0.2); color: var(--tier-1); }
    .tier-badge.t-2 { background: rgba(250, 204, 21, 0.2); color: var(--tier-2); }
    .tier-badge.t-3 { background: rgba(248, 113, 113, 0.2); color: var(--tier-3); }
    .edge-badge { background: rgba(96, 165, 250, 0.15); color: var(--edge-color); }

            .type-badge { 
      font-size: 0.85rem; 
      padding: 4px 10px; 
      border-radius: 4px; 
      font-weight: 600; 
      text-transform: uppercase; 
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    /* Base Colors */
    .type-badge.jug { background: rgba(74, 222, 128, 0.2); color: #86efac; }
    .type-badge.crimp { background: rgba(250, 204, 21, 0.2); color: #fde047; }
    .type-badge.pinch { background: rgba(244, 114, 182, 0.2); color: #f9a8d4; }
    .type-badge.sloper { background: rgba(96, 165, 250, 0.2); color: #93c5fd; }
    .type-badge.undercling { background: rgba(167, 139, 250, 0.2); color: #c4b5fd; }

    /* Combination Styles (Gradient Backgrounds) */
    .type-badge.jug.crimp { background: linear-gradient(90deg, rgba(74, 222, 128, 0.3) 50%, rgba(250, 204, 21, 0.3) 50%); }
    .type-badge.jug.pinch { background: linear-gradient(90deg, rgba(74, 222, 128, 0.3) 50%, rgba(244, 114, 182, 0.3) 50%); }
    .type-badge.jug.undercling { background: linear-gradient(90deg, rgba(74, 222, 128, 0.3) 50%, rgba(167, 139, 250, 0.3) 50%); }
    .type-badge.sloper.undercling { background: linear-gradient(90deg, rgba(96, 165, 250, 0.3) 50%, rgba(167, 139, 250, 0.3) 50%); }
    .type-badge.sloper.pinch { background: linear-gradient(90deg, rgba(250, 204, 21, 0.3) 50%, rgba(244, 114, 182, 0.3) 50%); }
    /* Add more combinations as needed */

    .board-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; padding: 1rem; background: var(--card); border-radius: 12px; border: 1px solid var(--border); }
    .toggle-group { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none; }
    .toggle-switch { width: 40px; height: 20px; background: #333; border-radius: 20px; position: relative; transition: background 0.3s; }
    .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: white; border-radius: 50%; transition: transform 0.3s; }
    .toggle-input:checked + .toggle-switch { background: var(--accent); }
    .toggle-input:checked + .toggle-switch::after { transform: translateX(20px); }
    .toggle-input { display: none; }

        /* Modal (Detail View) */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 1rem;
    }

    .modal-overlay.active { opacity: 1; pointer-events: all; }

    .modal-content {
      background: var(--card); width: 100%; max-width: 650px; /* Slightly wider for side-by-side */
      border-radius: 16px; border: 1px solid var(--border);
      overflow: hidden; transform: scale(0.9); transition: transform 0.3s;
      display: flex; flex-direction: column;
    }

    .modal-overlay.active .modal-content { transform: scale(1); }

    /* Side-by-Side Images */
    .modal-images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }

    .modal-img-column {
      background: #111;
      display: flex;
      flex-direction: column;
    }

    .modal-img-container {
      height: 300px; /* TALLER photos */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-in;
    }

    /* Centered Label Below Image */
    .modal-img-label {
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
      padding: 0.5rem 0 1rem 0;
    }

    .modal-details { padding: 1.5rem; }
    
    /* Header Layout */
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    /* Tags Row (Left aligned) */
    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    /* Type Tag (Right aligned) */
    .modal-type-row {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 1rem;
    }

    .close-btn {
      background: transparent; border: none; color: var(--fg-muted);
      font-size: 1.5rem; cursor: pointer; padding: 0.5rem; line-height: 1;
    }
    .close-btn:hover { color: var(--fg); }

    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; cursor: zoom-out; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    #lightbox.active { opacity: 1; pointer-events: all; }
    #lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

    /* Hold List Section */
    .hold-list-section { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border); }
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .filters-container { display: flex; gap: 1rem; flex-wrap: wrap; width: 100%; }
    .filter-group { display: flex; gap: 0.5rem; align-items: center; }
    .filter-group-label { font-size: 0.75rem; color: var(--fg-muted); text-transform: uppercase; margin-right: 0.25rem; }
    .filter-btn { background: transparent; border: 1px solid var(--border); color: var(--fg-muted); padding: 0.4rem 0.8rem; border-radius: 20px; cursor: pointer; transition: all 0.2s; font-family: inherit; font-size: 0.85rem; }
    .filter-btn:hover { border-color: var(--fg-muted); color: var(--fg); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .hold-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .hold-list-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; display: flex; gap: 1rem; align-items: flex-start; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .hold-list-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .list-card-img { width: 80px; height: 80px; object-fit: contain; background: #222; border-radius: 8px; flex-shrink: 0; }
    .list-card-info { display: flex; flex-direction: column; gap: 0.5rem; flex-grow: 1; }
    .list-card-info h4 { color: var(--fg); font-size: 1.1rem; margin: 0; }
    .list-card-info .type-text { color: var(--fg-muted); font-size: 0.85rem; margin: 0; }

    .angle-warning { background: rgba(248, 113, 113, 0.1); border-left: 3px solid var(--tier-3); padding: 0.75rem; margin-top: 1rem; font-size: 0.875rem; display: none; }
    .angle-warning.visible { display: block; }
	
	    /* Fix alignment of Title and Type Badge */
    #modalTitleRow {
      align-items: center; /* Centers them vertically */
    }

    #modalTitleRow .type-badge {
      margin-top: -2px; /* Nudges the badge up slightly as requested */
    }
	
	    /* Toggle Group with Tooltip */
    .toggle-group {
      position: relative; /* Allows absolute positioning of tooltip */
    }

    .toggle-label-text {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .info-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      font-weight: bold;
      cursor: help;
      transition: background 0.2s;
    }

    .info-icon:hover {
      background: rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.9);
    }

    .tier-tooltip {
      position: absolute;
      bottom: 130%; /* Positions it above the toggle */
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--fg);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      z-index: 50;
      text-align: left;
      pointer-events: none;
    }

    /* Arrow pointing down */
    .tier-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: var(--border);
    }

    .toggle-group:hover .tier-tooltip {
      opacity: 1;
      visibility: visible;
    }

    .tier-tooltip h4 {
      margin: 0 0 0.5rem 0;
      font-size: 0.9rem;
      color: var(--fg);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .tier-tooltip p {
      margin: 0 0 0.75rem 0;
      color: rgba(255,255,255,0.8);
    }

    .tier-tooltip p:last-child {
      margin-bottom: 0;
    }

    /* Highlight colors for tooltip text */
    .t1-desc { color: var(--tier-1); font-weight: 600; }
    .t2-desc { color: var(--tier-2); font-weight: 600; }
    .t3-desc { color: var(--tier-3); font-weight: 600; }
	
	    /* Toggle Switch Colors - specific override for OFF state */
    .toggle-switch { background: #333; }
    
    /* When checked, use the specific tier color defined in the inline style */
    .toggle-input:checked + .toggle-switch { 
        /* The background color is set inline in HTML, this ensures it applies */
        opacity: 1; 
    }
    
    /* Ensure the toggle knob is visible on colored backgrounds */
    .toggle-input:checked + .toggle-switch::after { 
        background: #111; /* Dark knob for contrast on bright colors */
    }
	
	    .hold-cell::after {
      content: ''; position: absolute; top: 5px; left: 5px; width: 12px; height: 12px;
      border-radius: 50%; opacity: 0; transition: opacity 0.3s; box-shadow: 0 0 5px currentColor;
    }
    /* Changed from .show-tiers .hold-cell::after */
    .hold-cell.show-tier-dot::after { opacity: 0.9; }
	
  </style>

<body>

  <div class="bg-atmosphere" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a href="index.html" class="logo font-display">BOARD LAB</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html#moves" class="nav-link">Moves</a></li>
          <li><a href="hold-quality.html" class="nav-link">Hold Quality</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="board-page">
    <header class="board-header">
      <h1 class="page-title">Kilter Board Map</h1>
      <p class="page-subtitle">The original 12x12 layout.</p>
    </header>

    <div class="board-wrapper" id="boardWrapper">
      <img src="board-layout.png" alt="Kilter Board Layout" class="board-image">
      <div class="grid-overlay" id="gridOverlay"></div>
    </div>

          <div class="board-controls">
      <!-- Tier 1 Toggle -->
      <label class="toggle-group">
        <input type="checkbox" class="toggle-input" id="tier1Toggle" checked>
        <div class="toggle-switch" style="background: var(--tier-1);"></div>
        <div class="toggle-label-text">
            <span>Tier 1 (Jugs)</span>
            <span class="info-icon">?</span>
            <div class="tier-tooltip">
              <p><span class="t1-desc">Tier 1</span> is the "best" holds (jugs). These are ~30+ mm deeply incut holds with enough space for 1+ finger pads to fit on the hold. Usually used with an open-hand grip (as opposed to a crimp grip). Steeper wall angles don't affect the quality of these much.</p>
            </div>
        </div>
      </label>

      <!-- Tier 2 Toggle -->
      <label class="toggle-group">
        <input type="checkbox" class="toggle-input" id="tier2Toggle" checked>
        <div class="toggle-switch" style="background: var(--tier-2);"></div>
        <div class="toggle-label-text">
            <span>Tier 2 (Intermediates)</span>
            <span class="info-icon">?</span>
            <div class="tier-tooltip">
              <p><span class="t2-desc">Tier 2</span> is "intermediate" holds. These include ~20-30mm "good" or "decent" crimps and pinches and slightly incut slopers with large edges (~30-40mm). Steeper wall angles can make these significantly worse, especially slopers and pinches.</p>
            </div>
        </div>
      </label>

      <!-- Tier 3 Toggle -->
      <label class="toggle-group">
        <input type="checkbox" class="toggle-input" id="tier3Toggle" checked>
        <div class="toggle-switch" style="background: var(--tier-3);"></div>
        <div class="toggle-label-text">
            <span>Tier 3 (Bad Holds)</span>
            <span class="info-icon">?</span>
            <div class="tier-tooltip">
              <p><span class="t3-desc">Tier 3</span> is "bad" holds. These include slightly incut or flat crimps and foot chips (usually <~20mm), along with fat or sloping vertical pinches. Making good use of these is highly dependent on body position and tension, and the hold quality rapidly degrades as wall angle steepens.</p>
            </div>
        </div>
      </label>
    </div>

    <section class="hold-list-section">
      <div class="list-header">
        <h2 class="font-display" style="font-size: 1.5rem; color: var(--fg); letter-spacing: 0.02em;">Hold Details</h2>
                <div class="filters-container">
            <div class="filter-group">
                <span class="filter-group-label">Tier:</span>
                <button class="filter-btn active" data-filter-type="tier" data-filter-value="all">All</button>
                <button class="filter-btn" data-filter-type="tier" data-filter-value="tier-1">Tier 1</button>
                <button class="filter-btn" data-filter-type="tier" data-filter-value="tier-2">Tier 2</button>
                <button class="filter-btn" data-filter-type="tier" data-filter-value="tier-3">Tier 3</button>
            </div>
            <div class="filter-group">
                <span class="filter-group-label">Type:</span>
                <!-- "All" button acts as a reset -->
                <button class="filter-btn active" data-filter-type="type" data-filter-value="all" id="filterAll">All</button>
                <button class="filter-btn" data-filter-type="type" data-filter-value="Jug">Jug</button>
                <button class="filter-btn" data-filter-type="type" data-filter-value="Crimp">Crimp</button>
                <button class="filter-btn" data-filter-type="type" data-filter-value="Pinch">Pinch</button>
                <button class="filter-btn" data-filter-type="type" data-filter-value="Sloper">Sloper</button>
                <button class="filter-btn" data-filter-type="type" data-filter-value="Undercling">Undercling</button>
            </div>
        </div>
      </div>
      <div class="hold-list-grid" id="holdListGrid"></div>
    </section>
  </main>

    <!-- Modal -->
  <div class="modal-overlay" id="holdModal">
    <div class="modal-content">
      <!-- Images Section (Side by Side) -->
      <div class="modal-images">
        <!-- Profile Column -->
        <div class="modal-img-column">
          <div class="modal-img-container">
            <img src="" alt="Hold Profile" id="modalProfileImg">
          </div>
          <div class="modal-img-label">Profile View</div>
        </div>
        <!-- Grip Column -->
        <div class="modal-img-column">
          <div class="modal-img-container">
            <img src="" alt="Hold Grip" id="modalGripImg">
          </div>
          <div class="modal-img-label">Grip View</div>
        </div>
      </div>

            <!-- Details Section -->
      <div class="modal-details">
        <div class="modal-header">
          <div class="modal-title-group">
            <!-- Added ID "modalTitleRow" to fix alignment -->
            <div id="modalTitleRow" style="display: flex; align-items: center; gap: 0.75rem;">
                <h3 id="modalTitle" style="font-size: 1.5rem; color: var(--fg); margin:0;">Hold ID</h3>
                <span class="type-badge" id="modalTypeBadge">Jug</span>
            </div>
            <div class="modal-tags" style="margin-top: 0.5rem;">
              <span class="tier-badge" id="modalBadge">Tier 1</span>
              <span class="tier-badge edge-badge" id="modalEdge">Large Edge</span>
            </div>
          </div>
          <button class="close-btn" id="closeModal">&times;</button>
        </div>

        <p style="color: var(--fg-muted); line-height: 1.6;" id="modalDesc">Description goes here.</p>
        
        <div class="angle-warning" id="modalWarning">
            ⚠️ <strong>Warning:</strong> Quality degrades significantly at steep angles. Requires high tension.
        </div>
      </div>
    </div>
  </div>

  <div id="lightbox"><img src="" id="lightboxImg" alt="Expanded View"></div>

    <script>
    let holdsData = {}; // Will be populated from JSON

    // ============================================
    // 1. LOAD DATA
    // ============================================
    async function loadData() {
        try {
            const response = await fetch('holds.json');
            if (!response.ok) throw new Error('Network response was not ok');
            holdsData = await response.json();
            
            // Initialize the page once data is loaded
            initPage();
        } catch (error) {
            console.error('Error loading holds data:', error);
            document.getElementById('holdListGrid').innerHTML = '<p style="color:var(--fg-muted)">Error loading data.</p>';
        }
    }

    // ============================================
    // 2. INITIALIZATION
    // ============================================
    function initPage() {
        renderGrid();
        renderGridLabels();
        renderHoldList();
        setupEventListeners();
    }

    // ============================================
    // 3. RENDER FUNCTIONS
    // ============================================
    
    const gridOverlay = document.getElementById('gridOverlay');
    const holdListGrid = document.getElementById('holdListGrid');
    const columns = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'P', 'Q'];

        function renderGrid() {
        gridOverlay.innerHTML = ''; // Clear loading state
        
        // Check initial state of toggles (default to checked/on if they exist)
        const t1Active = document.getElementById('tier1Toggle') ? document.getElementById('tier1Toggle').checked : true;
        const t2Active = document.getElementById('tier2Toggle') ? document.getElementById('tier2Toggle').checked : true;
        const t3Active = document.getElementById('tier3Toggle') ? document.getElementById('tier3Toggle').checked : true;

        for (let r = 18; r >= 1; r--) {
            for (let c = 0; c < 17; c++) {
                const colLetter = columns[c];
                const holdId = `${colLetter}${r}`;
                const cell = document.createElement('div');
                cell.className = 'hold-cell';
                cell.dataset.id = holdId;
                
                // Positioning classes
                if (r >= 17) cell.classList.add('tooltip-below');
                if (colLetter === 'P' || colLetter === 'Q') cell.classList.add('col-right');

                if (holdsData[holdId]) {
                    const data = holdsData[holdId];
                    cell.classList.add(`tier-${data.tier}`);
                    
                    // Initial visibility state
                    if ((data.tier === 1 && t1Active) || 
                        (data.tier === 2 && t2Active) || 
                        (data.tier === 3 && t3Active)) {
                        cell.classList.add('show-tier-dot');
                    }

                    // Prepare type text for tooltip
                    const typeText = Array.isArray(data.type) ? data.type.join(' / ') : data.type;

                    cell.innerHTML = `
                        <div class="hold-tooltip">
                            <img src="${data.profileImg}" class="tooltip-img" alt="${holdId}" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x100/222/555?text=No+Image'">
                            <div class="tooltip-info">
                                <h4>${holdId}</h4>
                                <p>${typeText}</p>
                                <span class="tier-badge t-${data.tier}">Tier ${data.tier}</span>
                            </div>
                        </div>`;
                    cell.addEventListener('click', () => openModal(holdId));
                }
                gridOverlay.appendChild(cell);
            }
        }
    }

    function renderGridLabels() {
        // Clear existing labels first
        const existingLabels = gridOverlay.querySelectorAll('.grid-label');
        existingLabels.forEach(label => label.remove());

        // Top Letters (Columns)
        columns.forEach((letter, i) => {
            const label = document.createElement('div');
            label.className = 'grid-label col-label';
            label.textContent = letter;
            label.style.left = `calc((${i} / 17) * 100%)`;
            gridOverlay.appendChild(label);
        });

        // Side Numbers (Rows)
        for (let r = 18; r >= 1; r--) {
            const label = document.createElement('div');
            label.className = 'grid-label row-label';
            label.textContent = r;
            const rowIndex = 18 - r;
            label.style.top = `calc((${rowIndex} / 18) * 100%)`;
            gridOverlay.appendChild(label);
        }
    }

        function renderHoldList() {
        holdListGrid.innerHTML = '';
        
        // 1. Determine active Tier
        const activeTier = document.querySelector('.filter-btn[data-filter-type="tier"].active').dataset.filterValue;

        // 2. Determine active Types (can be multiple)
        const activeTypeButtons = document.querySelectorAll('.filter-btn[data-filter-type="type"].active');
        const activeTypes = Array.from(activeTypeButtons).map(btn => btn.dataset.filterValue);
        const isFilteringByType = !activeTypes.includes('all'); // True if specific types are selected

        Object.keys(holdsData).forEach(id => {
            const data = holdsData[id];
            
            // Tier Filter
            if (activeTier !== 'all' && `tier-${data.tier}` !== activeTier) return;

            // Type Filter (AND Logic)
            if (isFilteringByType) {
                // Normalize data.type to an array
                const holdTypes = Array.isArray(data.type) ? data.type : [data.type];
                
                // Check if the hold has ALL of the selected types
                const hasAllSelected = activeTypes.every(t => holdTypes.includes(t));
                
                if (!hasAllSelected) return;
            }

            // Render Card
            const card = document.createElement('div');
            card.className = 'hold-list-card';
            card.onclick = () => openModal(id);

            const typeText = Array.isArray(data.type) ? data.type.join(' / ') : data.type;

            card.innerHTML = `
                <img src="${data.profileImg}" class="list-card-img" alt="${id}" onerror="this.onerror=null; this.src='https://via.placeholder.com/80x80/222/555?text=N/A'">
                <div class="list-card-info">
                    <h4>${id}</h4>
                    <p class="type-text">${typeText}</p>
                    <span class="tier-badge t-${data.tier}">Tier ${data.tier}</span>
                </div>`;
            holdListGrid.appendChild(card);
        });
    }

    // ============================================
    // 4. INTERACTIONS
    // ============================================
        function setupEventListeners() {
        const modal = document.getElementById('holdModal');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.getElementById('closeModal');
        
        // New Toggle References
        const tier1Toggle = document.getElementById('tier1Toggle');
        const tier2Toggle = document.getElementById('tier2Toggle');
        const tier3Toggle = document.getElementById('tier3Toggle');
        
        const boardWrapper = document.getElementById('boardWrapper');
        const filterBtns = document.querySelectorAll('.filter-btn');

                window.openModal = function(id) {
            const data = holdsData[id];
            if (!data) return;

            document.getElementById('modalTitle').textContent = id;
            
            const descEl = document.getElementById('modalDesc');
            descEl.textContent = data.desc;
            descEl.style.color = "rgba(255,255,255,0.85)";

            const profileImg = document.getElementById('modalProfileImg');
            const gripImg = document.getElementById('modalGripImg');
            profileImg.src = data.profileImg;
            gripImg.src = data.gripImg;
            profileImg.onclick = () => openLightbox(data.profileImg);
            gripImg.onclick = () => openLightbox(data.gripImg);

            const tierBadge = document.getElementById('modalBadge');
            tierBadge.textContent = `Tier ${data.tier}`;
            tierBadge.className = `tier-badge t-${data.tier}`;
            document.getElementById('modalEdge').textContent = data.edgeSize || 'Unknown';
            
            // Update Type Badge next to title
            const typeBadge = document.getElementById('modalTypeBadge');
            const typeArray = Array.isArray(data.type) ? data.type : [data.type];

            // 1. Set Text Content: "Undercling Jug" (Space separated)
            typeBadge.textContent = typeArray.join(' ');

            // 2. Set Classes: "type-badge undercling jug" (Space separated)
            // This ensures your CSS gradient rules work properly
            const classString = typeArray.map(t => t.toLowerCase()).join(' ');
            typeBadge.className = `type-badge ${classString}`;

            const warningEl = document.getElementById('modalWarning');
            if (data.angleSensitive) warningEl.classList.add('visible');
            else warningEl.classList.remove('visible');

            modal.classList.add('active');
        };

        function openLightbox(src) { lightboxImg.src = src; lightbox.classList.add('active'); }
        function closeLightbox() { lightbox.classList.remove('active'); }
        function closeModal() { modal.classList.remove('active'); }

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        lightbox.addEventListener('click', closeLightbox);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { lightbox.classList.contains('active') ? closeLightbox() : closeModal(); }
        });

                // ============================================
        // TIER TOGGLE LOGIC (Multi-Select Visibility)
        // ============================================
        const tierToggles = {
            1: tier1Toggle,
            2: tier2Toggle,
            3: tier3Toggle
        };

        // Function to update grid visibility based on toggles
        function updateGridVisibility() {
            // Iterate over every cell in the grid
            const cells = gridOverlay.querySelectorAll('.hold-cell');
            cells.forEach(cell => {
                const id = cell.dataset.id;
                const data = holdsData[id];
                
                if (data) {
                    const tier = data.tier;
                    const toggle = tierToggles[tier];
                    
                    // If the toggle exists and is checked, show the dot
                    if (toggle && toggle.checked) {
                        cell.classList.add('show-tier-dot');
                    } else {
                        cell.classList.remove('show-tier-dot');
                    }
                }
            });
        }

        // Attach listeners to the three toggles
        [tier1Toggle, tier2Toggle, tier3Toggle].forEach(toggle => {
            toggle.addEventListener('change', () => {
                updateGridVisibility();
            });
        });
        
        // Filter Button Logic
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const group = btn.dataset.filterType;
                
                if (group === 'tier') {
                    document.querySelectorAll(`.filter-btn[data-filter-type="tier"]`).forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }

                if (group === 'type') {
                    if (btn.dataset.filterValue === 'all') {
                        document.querySelectorAll(`.filter-btn[data-filter-type="type"]`).forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    } else {
                        document.getElementById('filterAll').classList.remove('active');
                        btn.classList.toggle('active');

                        const anyActive = document.querySelector('.filter-btn[data-filter-type="type"]:not([data-filter-value="all"]).active');
                        if (!anyActive) {
                            document.getElementById('filterAll').classList.add('active');
                        }
                    }
                }

                renderHoldList();
            });
        });
    }

    // ============================================
    // 5. KICKSTART
    // ============================================
    loadData();
  </script>
    <script src="nav.js"></script>
