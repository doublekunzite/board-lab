<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kilter Board Map | Board Lab</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* ============================================
       BOARD MAP SPECIFIC STYLES
       ============================================ */
    :root {
      --tier-1: #4ade80; /* Green - Good */
      --tier-2: #facc15; /* Yellow - Medium */
      --tier-3: #f87171; /* Red - Hard */
      --edge-color: #60a5fa; /* Blue - for Edge Size */
    }

    .board-page {
      position: relative;
      z-index: 10;
      padding: 8rem 2rem 4rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .board-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    /* The Board Container */
    .board-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background: #111;
      border-radius: 8px;
      overflow: visible;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .board-image {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0.8;
      border-radius: 8px;
    }

    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(17, 1fr);
      grid-template-rows: repeat(18, 1fr);
      overflow: visible;
    }

    .hold-cell {
      position: relative;
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.2s;
      z-index: 1;
    }

    .hold-cell:hover {
      background: rgba(255,255,255,0.1);
      z-index: 100; 
    }

    .hold-cell::after {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 0 5px currentColor;
    }

    .show-tiers .hold-cell::after { opacity: 0.9; }
    .hold-cell.tier-1::after { background: var(--tier-1); color: var(--tier-1); }
    .hold-cell.tier-2::after { background: var(--tier-2); color: var(--tier-2); }
    .hold-cell.tier-3::after { background: var(--tier-3); color: var(--tier-3); }

    .hold-tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 200;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .hold-cell:hover .hold-tooltip { opacity: 1; }
    .hold-cell.tooltip-below .hold-tooltip { bottom: auto; top: 100%; }
    .hold-cell.col-right .hold-tooltip { left: auto; right: 0; transform: translateX(0); }

    .tooltip-img {
      width: 100%;
      height: 100px;
      object-fit: contain;
      background: #222;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .tooltip-info h4 { font-size: 1rem; color: var(--fg); margin-bottom: 0.25rem; }
    .tooltip-info p { font-size: 0.75rem; color: var(--fg-muted); }

    .tier-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }
    .tier-badge.t-1 { background: rgba(74, 222, 128, 0.2); color: var(--tier-1); }
    .tier-badge.t-2 { background: rgba(250, 204, 21, 0.2); color: var(--tier-2); }
    .tier-badge.t-3 { background: rgba(248, 113, 113, 0.2); color: var(--tier-3); }
    
    /* NEW: Edge Size Badge Style */
    .edge-badge {
      background: rgba(96, 165, 250, 0.15);
      color: var(--edge-color);
    }

    .board-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .toggle-switch {
      width: 40px;
      height: 20px;
      background: #333;
      border-radius: 20px;
      position: relative;
      transition: background 0.3s;
    }
    
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .toggle-input:checked + .toggle-switch { background: var(--accent); }
    .toggle-input:checked + .toggle-switch::after { transform: translateX(20px); }
    .toggle-input { display: none; }

    /* Modal (Detail View) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active { opacity: 1; pointer-events: all; }

    .modal-content {
      background: var(--card);
      width: 90%;
      max-width: 600px;
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      transform: scale(0.9);
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal-content { transform: scale(1); }

    /* FIX: Image Grid Layout */
    .modal-images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }

    /* Wrapper for Image + Label */
    .modal-img-column {
      background: #111;
      display: flex;
      flex-direction: column;
    }

    .modal-img-container {
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-in;
    }

    /* Centered Label Below Image */
    .modal-img-label {
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      padding: 0.5rem 0 1rem 0;
    }

    .modal-details { padding: 1.5rem; }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    
    /* Tag container */
    .modal-tags {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--fg-muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
      line-height: 1;
    }
    .close-btn:hover { color: var(--fg); }

    /* Lightbox */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #lightbox.active { opacity: 1; pointer-events: all; }
    #lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .font-chalk {
      font-family: 'Segoe Script', 'Bradley Hand ITC', 'Lucida Handwriting', 'Comic Sans MS', cursive;
    }

    /* Hold List Section */
    .hold-list-section {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg-muted);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .filter-btn:hover { border-color: var(--fg-muted); color: var(--fg); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .hold-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .hold-list-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .hold-list-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .list-card-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      background: #222;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .list-card-info { display: flex; flex-direction: column; gap: 0.5rem; flex-grow: 1; }
    .list-card-info h4 { color: var(--fg); font-size: 1.1rem; margin: 0; }
    .list-card-info .type-text { color: var(--fg-muted); font-size: 0.85rem; margin: 0; }

  </style>
</head>
<body>

  <div class="bg-atmosphere" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a href="index.html" class="logo font-display">BOARD LAB</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html#moves" class="nav-link">Moves</a></li>
          <li><a href="hold-quality.html" class="nav-link">Hold Quality</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="board-page">
    
    <header class="board-header">
      <h1 class="chalk-title font-chalk">Kilter Board Map</h1>
      <p class="chalk-subtitle font-chalk">Visualizing the terrain.</p>
    </header>

    <div class="board-wrapper" id="boardWrapper">
      <img src="board-layout.png" alt="Kilter Board Layout" class="board-image">
      <div class="grid-overlay" id="gridOverlay"></div>
    </div>

    <div class="board-controls">
      <label class="toggle-group">
        <input type="checkbox" class="toggle-input" id="tierToggle">
        <div class="toggle-switch"></div>
        <span>Show Quality Tiers</span>
      </label>
    </div>

    <section class="hold-list-section">
      <div class="list-header">
        <h2 class="font-chalk" style="font-size: 1.5rem; color: var(--fg);">Hold Details</h2>
        <div id="filterControls">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="tier-1">Tier 1</button>
          <button class="filter-btn" data-filter="tier-2">Tier 2</button>
          <button class="filter-btn" data-filter="tier-3">Tier 3</button>
        </div>
      </div>
      <div class="hold-list-grid" id="holdListGrid"></div>
    </section>

  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="holdModal">
    <div class="modal-content">
      <!-- Images Section -->
      <div class="modal-images">
        <!-- Profile Column -->
        <div class="modal-img-column">
          <div class="modal-img-container">
            <img src="" alt="Hold Profile" id="modalProfileImg">
          </div>
          <div class="modal-img-label">Profile View</div>
        </div>
        <!-- Grip Column -->
        <div class="modal-img-column">
          <div class="modal-img-container">
            <img src="" alt="Hold Grip" id="modalGripImg">
          </div>
          <div class="modal-img-label">Grip View</div>
        </div>
      </div>

      <!-- Details Section -->
      <div class="modal-details">
        <div class="modal-header">
          <h3 id="modalTitle" style="font-size: 1.5rem; color: var(--fg);">Hold ID</h3>
          <button class="close-btn" id="closeModal">&times;</button>
        </div>
        
        <!-- Tags Area -->
        <div class="modal-tags">
          <span class="tier-badge" id="modalBadge">Tier 1</span>
          <span class="tier-badge edge-badge" id="modalEdge">Large Edge</span>
          <span style="color: var(--fg-muted); font-size: 0.9rem; margin-left: auto;" id="modalType">Jug</span>
        </div>

        <p style="margin-top: 1rem; color: var(--fg-muted);" id="modalDesc">Description goes here.</p>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox">
    <img src="" id="lightboxImg" alt="Expanded View">
  </div>

  <script>
    // ============================================
    // 1. DATA STORE
    // ============================================
    const holdsData = {
      "A1": { 
        tier: 2, 
        type: "Incut Crimp", 
        edgeSize: "~20 mm",
        profileImg: "holds/A1-profile.png", 
        gripImg: "holds/A1-grip.png",
        desc: "Slanted crimp / Macro foothold (incut)",
      },
	  
	  "B1": { 
        tier: 2, 
        type: "Incut Pinch", 
        edgeSize: "~25 mm",
        profileImg: "holds/B1-profile.png", 
        gripImg: "holds/B1-grip.png",
        desc: "Slanted crimp or pinch / Macro foothold (incut)",
      },
	  
	  "C1": { 
        tier: 2, 
        type: "Incut Crimp", 
        edgeSize: "~25 mm",
        profileImg: "holds/C1-profile.png", 
        gripImg: "holds/C1-grip.png",
        desc: "Long crimp / Macro foothold (incut)",
      },
	  
	  "D1": { 
        tier: 2, 
        type: "Incut Crimp", 
        edgeSize: "~25 mm",
        profileImg: "holds/D1-profile.png", 
        gripImg: "holds/D1-grip.png",
        desc: "Sidepull crimp / Macro foothold (incut)",
      },
	  
	  "E1": { 
        tier: 2, 
        type: "Flat Crimp", 
        edgeSize: "~20 mm",
        profileImg: "holds/E1-profile.png", 
        gripImg: "holds/E1-grip.png",
        desc: "Flat sidepull crimp / Macro foothold (flat)",
      },
	  
	  "F1": { 
        tier: 2, 
        type: "Incut Crimp", 
        edgeSize: "~25 mm",
        profileImg: "holds/F1-profile.png", 
        gripImg: "holds/F1-grip.png",
        desc: "Slightly incut, almost flat sidepull crimp / Macro foothold (incut)",
      },
	  
	  "G1": { 
        tier: 1, 
        type: "Jug", 
        edgeSize: "~30 mm",
        profileImg: "holds/G1-profile.png", 
        gripImg: "holds/G1-grip.png",
        desc: "Jug that's deeper in the middle and shallower at the edges / Macro foothold (incut)",
      },
	  
	  "H1": { 
        tier: 2, 
        type: "Incut Crimp", 
        edgeSize: "~20 mm",
        profileImg: "holds/H1-profile.png", 
        gripImg: "holds/H1-grip.png",
        desc: "Incut crimp, heart shape / Macro foothold (incut)",
      },
	  
	  "I1": { 
        tier: 2, 
        type: "Incut Crimp", 
        edgeSize: "~25 mm",
        profileImg: "holds/I1-profile.png", 
        gripImg: "holds/I1-grip.png",
        desc: "Slightly incut, almost flat sidepull crimp / Macro foothold (incut)",
      },
	  
	  "J1": { 
        tier: 1, 
        type: "Incut Pinch", 
        edgeSize: "~30 mm",
        profileImg: "holds/J1-profile.png", 
        gripImg: "holds/J1-grip.png",
        desc: "Deeply incut pinch jug / Macro foothold (incut)",
      },
	  
	  "K1": { 
        tier: 2, 
        type: "Flat Crimp", 
        edgeSize: "~20 mm",
        profileImg: "holds/K1-profile.png", 
        gripImg: "holds/K1-grip.png",
        desc: "Flat sidepull crimp / Macro foothold (flat)",
      },
	  
	  "L1": { 
        tier: 2, 
        type: "Incut Crimp", 
        edgeSize: "~25 mm",
        profileImg: "holds/L1-profile.png", 
        gripImg: "holds/L1-grip.png",
        desc: "Incut sidepull crimp / Macro foothold (incut)",
      },
	  
	  "M1": { 
        tier: 3, 
        type: "Sloping Pinch", 
        edgeSize: "~30 mm",
        profileImg: "holds/M1-profile.png", 
        gripImg: "holds/M1-grip.png",
        desc: "Fat, sloping pinch / Macro foothold (sloping)",
      },
	  
	  "N1": { 
        tier: 2, 
        type: "Incut Crimp", 
        edgeSize: "~20 mm",
        profileImg: "holds/N1-profile.png", 
        gripImg: "holds/N1-grip.png",
        desc: "Incut sidepull crimp / Macro foothold (incut)",
      },
	  
	  "O1": { 
        tier: 2, 
        type: "Incut Crimp", 
        edgeSize: "~25 mm",
        profileImg: "holds/O1-profile.png", 
        gripImg: "holds/O1-grip.png",
        desc: "Long incut crimp / Macro foothold (incut)",
      },
	  
	  "P1": { 
        tier: 2, 
        type: "Incut Crimp", 
        edgeSize: "~20 mm",
        profileImg: "holds/P1-profile.png", 
        gripImg: "holds/P1-grip.png",
        desc: "Incut sidepull crimp / Macro foothold (incut)",
      },
	  
      "Q1": { 
        tier: 2, 
        type: "Incut Crimp", 
		edgeSize: "~20 mm"
        profileImg: "holds/Q1-profile.png", 
        gripImg: "holds/Q1-grip.png",
        desc: "Incut sidepull crimp that could technically be pinched / Macro foothold (incut)",
      },
      // Add more holds here...
    };

    // ============================================
    // 2. GRID & LIST GENERATION
    // ============================================
    const gridOverlay = document.getElementById('gridOverlay');
    const holdListGrid = document.getElementById('holdListGrid');
    const columns = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'P', 'Q'];

    for (let r = 18; r >= 1; r--) {
      for (let c = 0; c < 17; c++) {
        const colLetter = columns[c];
        const holdId = `${colLetter}${r}`;
        
        const cell = document.createElement('div');
        cell.className = 'hold-cell';
        cell.dataset.id = holdId;
        if (r >= 17) cell.classList.add('tooltip-below');
        if (colLetter === 'P' || colLetter === 'Q') cell.classList.add('col-right');

        if (holdsData[holdId]) {
          const data = holdsData[holdId];
          cell.classList.add(`tier-${data.tier}`);
          
          const tooltipHTML = `
            <div class="hold-tooltip">
              <img src="${data.profileImg}" class="tooltip-img" alt="${holdId}" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x100/222/555?text=No+Image'">
              <div class="tooltip-info">
                <h4>${holdId}</h4>
                <p>${data.type}</p>
                <span class="tier-badge t-${data.tier}">Tier ${data.tier}</span>
              </div>
            </div>
          `;
          cell.innerHTML = tooltipHTML;
          cell.addEventListener('click', () => openModal(holdId));
        }
        gridOverlay.appendChild(cell);
      }
    }

    function renderHoldList(filter = 'all') {
        holdListGrid.innerHTML = ''; 
        Object.keys(holdsData).forEach(id => {
            const data = holdsData[id];
            if (filter !== 'all' && `tier-${data.tier}` !== filter) return;

            const card = document.createElement('div');
            card.className = 'hold-list-card';
            card.onclick = () => openModal(id);

            card.innerHTML = `
                <img src="${data.profileImg}" class="list-card-img" alt="${id}" onerror="this.onerror=null; this.src='https://via.placeholder.com/80x80/222/555?text=N/A'">
                <div class="list-card-info">
                    <h4>${id}</h4>
                    <p class="type-text">${data.type}</p>
                    <span class="tier-badge t-${data.tier}">Tier ${data.tier}</span>
                </div>
            `;
            holdListGrid.appendChild(card);
        });
    }
    renderHoldList();

    // ============================================
    // 3. INTERACTIONS
    // ============================================

    const modal = document.getElementById('holdModal');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeBtn = document.getElementById('closeModal');
    const tierToggle = document.getElementById('tierToggle');
    const boardWrapper = document.getElementById('boardWrapper');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function openModal(id) {
      const data = holdsData[id];
      if (!data) return;

      document.getElementById('modalTitle').textContent = id;
      document.getElementById('modalType').textContent = data.type;
      document.getElementById('modalDesc').textContent = data.desc;
      
      const profileImg = document.getElementById('modalProfileImg');
      const gripImg = document.getElementById('modalGripImg');

      profileImg.src = data.profileImg;
      gripImg.src = data.gripImg;

      // Image Click Listeners
      profileImg.onclick = () => openLightbox(data.profileImg);
      gripImg.onclick = () => openLightbox(data.gripImg);

      // Badges
      const tierBadge = document.getElementById('modalBadge');
      tierBadge.textContent = `Tier ${data.tier}`;
      tierBadge.className = `tier-badge t-${data.tier}`;

      const edgeBadge = document.getElementById('modalEdge');
      edgeBadge.textContent = data.edgeSize || 'Unknown'; // Handle missing data

      modal.classList.add('active');
    }

    function closeModal() { modal.classList.remove('active'); }
    
    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('active');
    }
    
    function closeLightbox() { lightbox.classList.remove('active'); }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    lightbox.addEventListener('click', closeLightbox);

    document.addEventListener('keydown', (e) => { 
      if (e.key === 'Escape') {
        if(lightbox.classList.contains('active')) closeLightbox();
        else closeModal();
      }
    });

    tierToggle.addEventListener('change', () => {
        tierToggle.checked ? boardWrapper.classList.add('show-tiers') : boardWrapper.classList.remove('show-tiers');
    });

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderHoldList(btn.dataset.filter);
        });
    });

  </script>
</body>
</html>
