<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kilter Board Map | Board Lab</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* ============================================
       BOARD MAP SPECIFIC STYLES
       ============================================ */
    :root {
      --tier-1: #4ade80; /* Green - Good */
      --tier-2: #facc15; /* Yellow - Medium */
      --tier-3: #f87171; /* Red - Hard */
    }

    .board-page {
      position: relative;
      z-index: 10;
      padding: 8rem 2rem 4rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .board-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    /* The Board Container */
    .board-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background: #111;
      border-radius: 8px;
      /* IMPORTANT: Allows tooltips to escape the box */
      overflow: visible; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* The Board Image */
    .board-image {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0.8;
      border-radius: 8px;
    }

    /* The Interactive Grid Overlay */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(17, 1fr);
      grid-template-rows: repeat(18, 1fr);
      overflow: visible; /* Ensure grid cells don't clip tooltips */
    }

    /* Individual Hold Cell */
    .hold-cell {
      position: relative;
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.2s;
      /* Default z-index */
      z-index: 1;
    }

    .hold-cell:hover {
      background: rgba(255,255,255,0.1);
      /* Pop cell above neighbors when hovered */
      z-index: 100; 
    }

    /* Tier Colors (Hidden by default) */
    .hold-cell::after {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 0 5px currentColor;
    }

    /* Show Tiers when class is active */
    .show-tiers .hold-cell::after {
      opacity: 0.9;
    }
    .hold-cell.tier-1::after { background: var(--tier-1); color: var(--tier-1); }
    .hold-cell.tier-2::after { background: var(--tier-2); color: var(--tier-2); }
    .hold-cell.tier-3::after { background: var(--tier-3); color: var(--tier-3); }

    /* Tooltip (Hover Card) */
    .hold-tooltip {
      position: absolute;
      bottom: 100%; /* Default: Above */
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 200; /* Above everything */
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .hold-cell:hover .hold-tooltip {
      opacity: 1;
    }

    /* Force tooltip BELOW the hold for top rows */
    .hold-cell.tooltip-below .hold-tooltip {
      bottom: auto;
      top: 100%; 
    }

    /* Fix tooltip position for right-most columns */
    .hold-cell.col-right .hold-tooltip {
      left: auto;
      right: 0;
      transform: translateX(0);
    }

    .tooltip-img {
      width: 100%;
      height: 100px;
      object-fit: contain;
      background: #222;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .tooltip-info h4 {
      font-size: 1rem;
      color: var(--fg);
      margin-bottom: 0.25rem;
    }
    
    .tooltip-info p {
      font-size: 0.75rem;
      color: var(--fg-muted);
    }

    .tier-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }
    .tier-badge.t-1 { background: rgba(74, 222, 128, 0.2); color: var(--tier-1); }
    .tier-badge.t-2 { background: rgba(250, 204, 21, 0.2); color: var(--tier-2); }
    .tier-badge.t-3 { background: rgba(248, 113, 113, 0.2); color: var(--tier-3); }

    /* Controls */
    .board-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .toggle-switch {
      width: 40px;
      height: 20px;
      background: #333;
      border-radius: 20px;
      position: relative;
      transition: background 0.3s;
    }
    
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .toggle-input:checked + .toggle-switch { background: var(--accent); }
    .toggle-input:checked + .toggle-switch::after { transform: translateX(20px); }
    .toggle-input { display: none; }

    /* Modal (Detail View) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      background: var(--card);
      width: 90%;
      max-width: 600px;
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      transform: scale(0.9);
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    /* FIX: Force Grid Layout for Images */
    .modal-images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      background: var(--border);
      gap: 1px; /* Small gap between images */
    }

    .modal-img-container {
      background: #111;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
    }

    .modal-img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-in; /* Indicate clickable */
    }

    .modal-details {
      padding: 1.5rem;
      width: 100%;
      box-sizing: border-box;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--fg-muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
      line-height: 1;
    }

    .close-btn:hover { color: var(--fg); }

    /* Lightbox (Expanded Image View) */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 2000; /* Above modal */
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    
    #lightbox.active {
      opacity: 1;
      pointer-events: all;
    }

    #lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    /* Local Chalk Font Replacement */
    .font-chalk {
      font-family: 'Segoe Script', 'Bradley Hand ITC', 'Lucida Handwriting', 'Comic Sans MS', cursive;
    }

    /* ============================================
       HOLD LIST SECTION
       ============================================ */
    .hold-list-section {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg-muted);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .filter-btn:hover {
      border-color: var(--fg-muted);
      color: var(--fg);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .hold-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .hold-list-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .hold-list-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .list-card-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      background: #222;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .list-card-info {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex-grow: 1;
    }

    .list-card-info h4 {
      color: var(--fg);
      font-size: 1.1rem;
      margin: 0;
    }

    .list-card-info .type-text {
      color: var(--fg-muted);
      font-size: 0.85rem;
      margin: 0;
    }

  </style>
</head>
<body>

  <!-- Backgrounds -->
  <div class="bg-atmosphere" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- Header -->
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a href="index.html" class="logo font-display">BOARD LAB</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html#moves" class="nav-link">Moves</a></li>
          <li><a href="hold-quality.html" class="nav-link">Hold Quality</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="board-page">
    
    <header class="board-header">
      <h1 class="chalk-title font-chalk">Kilter Board Map</h1>
      <p class="chalk-subtitle font-chalk">Visualizing the terrain.</p>
    </header>

    <!-- Interactive Board -->
    <div class="board-wrapper" id="boardWrapper">
      <!-- Background Image -->
      <img src="board-layout.png" alt="Kilter Board Layout" class="board-image">
      
      <!-- Grid Overlay (Generated by JS) -->
      <div class="grid-overlay" id="gridOverlay">
        <!-- Hold cells will be injected here -->
      </div>
    </div>

    <!-- Controls -->
    <div class="board-controls">
      <label class="toggle-group">
        <input type="checkbox" class="toggle-input" id="tierToggle">
        <div class="toggle-switch"></div>
        <span>Show Quality Tiers</span>
      </label>
    </div>

    <!-- Filterable Hold List -->
    <section class="hold-list-section">
      <div class="list-header">
        <h2 class="font-chalk" style="font-size: 1.5rem; color: var(--fg);">Hold Details</h2>
        
        <div id="filterControls">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="tier-1">Tier 1</button>
          <button class="filter-btn" data-filter="tier-2">Tier 2</button>
          <button class="filter-btn" data-filter="tier-3">Tier 3</button>
        </div>
      </div>

      <div class="hold-list-grid" id="holdListGrid"></div>
    </section>

  </main>

  <!-- Modal (Popup) -->
  <div class="modal-overlay" id="holdModal">
    <div class="modal-content">
      <div class="modal-images">
        <div class="modal-img-container">
          <img src="" alt="Hold Profile" id="modalProfileImg">
          <span style="position:absolute; bottom:5px; left:10px; font-size:0.7rem; opacity:0.5;">Profile View</span>
        </div>
        <div class="modal-img-container">
          <img src="" alt="Hold Grip" id="modalGripImg">
          <span style="position:absolute; bottom:5px; left:10px; font-size:0.7rem; opacity:0.5;">Grip View</span>
        </div>
      </div>
      <div class="modal-details">
        <div class="modal-header">
          <h3 id="modalTitle" style="font-size: 1.5rem; color: var(--fg);">Hold ID</h3>
          <button class="close-btn" id="closeModal">&times;</button>
        </div>
        <div id="modalMeta">
          <span class="tier-badge" id="modalBadge">Tier 1</span>
          <span style="margin-left: 0.5rem; color: var(--fg-muted);" id="modalType">Jug</span>
        </div>
        <p style="margin-top: 1rem; color: var(--fg-muted);" id="modalDesc">Description goes here.</p>
      </div>
    </div>
  </div>

  <!-- Lightbox (Full Screen Image) -->
  <div id="lightbox">
    <img src="" id="lightboxImg" alt="Expanded View">
  </div>

  <script>
    // ============================================
    // 1. DATA STORE
    // ============================================
    const holdsData = {
      // Example Data Entries
      "A18": { 
        tier: 1, 
        type: "Jug", 
        profileImg: "holds/A18-profile.png", 
        gripImg: "holds/A18-grip.png",
        desc: "Finish hold - Large Bucket.",
      },
      "Q18": { 
        tier: 2, 
        type: "Crimp", 
        profileImg: "holds/Q18-profile.png", 
        gripImg: "holds/Q18-grip.png",
        desc: "Wavy sidepull crimp. Macro foothold (incut).",
      },
      // Add your other holds here...
    };

    // ============================================
    // 2. GRID & LIST GENERATION
    // ============================================
    const gridOverlay = document.getElementById('gridOverlay');
    const holdListGrid = document.getElementById('holdListGrid');
    const columns = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'P', 'Q'];

    // 1. Generate Grid
    for (let r = 18; r >= 1; r--) {
      for (let c = 0; c < 17; c++) {
        const colLetter = columns[c];
        const holdId = `${colLetter}${r}`;
        
        const cell = document.createElement('div');
        cell.className = 'hold-cell';
        cell.dataset.id = holdId;

        if (r >= 17) cell.classList.add('tooltip-below');
        if (colLetter === 'P' || colLetter === 'Q') cell.classList.add('col-right');

        if (holdsData[holdId]) {
          const data = holdsData[holdId];
          cell.classList.add(`tier-${data.tier}`);
          
          const tooltipHTML = `
            <div class="hold-tooltip">
              <img src="${data.profileImg}" class="tooltip-img" alt="${holdId}" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x100/222/555?text=No+Image'">
              <div class="tooltip-info">
                <h4>${holdId}</h4>
                <p>${data.type}</p>
                <span class="tier-badge t-${data.tier}">Tier ${data.tier}</span>
              </div>
            </div>
          `;
          cell.innerHTML = tooltipHTML;
          cell.addEventListener('click', () => openModal(holdId));
        }

        gridOverlay.appendChild(cell);
      }
    }

    // 2. Generate List
    function renderHoldList(filter = 'all') {
        holdListGrid.innerHTML = ''; 
        Object.keys(holdsData).forEach(id => {
            const data = holdsData[id];
            if (filter !== 'all' && `tier-${data.tier}` !== filter) return;

            const card = document.createElement('div');
            card.className = 'hold-list-card';
            card.onclick = () => openModal(id);

            card.innerHTML = `
                <img src="${data.profileImg}" class="list-card-img" alt="${id}" onerror="this.onerror=null; this.src='https://via.placeholder.com/80x80/222/555?text=N/A'">
                <div class="list-card-info">
                    <h4>${id}</h4>
                    <p class="type-text">${data.type}</p>
                    <span class="tier-badge t-${data.tier}">Tier ${data.tier}</span>
                </div>
            `;
            holdListGrid.appendChild(card);
        });
    }
    renderHoldList();

    // ============================================
    // 3. INTERACTIONS
    // ============================================

    const modal = document.getElementById('holdModal');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeBtn = document.getElementById('closeModal');
    const tierToggle = document.getElementById('tierToggle');
    const boardWrapper = document.getElementById('boardWrapper');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // Open Modal
    function openModal(id) {
      const data = holdsData[id];
      if (!data) return;

      document.getElementById('modalTitle').textContent = id;
      document.getElementById('modalType').textContent = data.type;
      document.getElementById('modalDesc').textContent = data.desc;
      
      const profileImg = document.getElementById('modalProfileImg');
      const gripImg = document.getElementById('modalGripImg');

      profileImg.src = data.profileImg;
      gripImg.src = data.gripImg;

      // Add click listeners for lightbox
      profileImg.onclick = () => openLightbox(data.profileImg);
      gripImg.onclick = () => openLightbox(data.gripImg);

      const badge = document.getElementById('modalBadge');
      badge.textContent = `Tier ${data.tier}`;
      badge.className = `tier-badge t-${data.tier}`;

      modal.classList.add('active');
    }

    // Close Modal
    function closeModal() { modal.classList.remove('active'); }
    
    // Lightbox Logic
    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('active');
    }
    
    function closeLightbox() {
      lightbox.classList.remove('active');
    }

    // Event Listeners
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    lightbox.addEventListener('click', closeLightbox); // Click background to close

    document.addEventListener('keydown', (e) => { 
      if (e.key === 'Escape') {
        if(lightbox.classList.contains('active')) closeLightbox();
        else closeModal();
      }
    });

    tierToggle.addEventListener('change', () => {
        tierToggle.checked ? boardWrapper.classList.add('show-tiers') : boardWrapper.classList.remove('show-tiers');
    });

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderHoldList(btn.dataset.filter);
        });
    });

  </script>
</body>
</html>
