<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kilter Board Map | Board Lab</title>
  <link rel="stylesheet" href="style.css">
  <!-- No external Google Fonts API -->
  
  <style>
    /* ============================================
       BOARD MAP SPECIFIC STYLES
       ============================================ */
    :root {
      --tier-1: #4ade80; /* Green - Good */
      --tier-2: #facc15; /* Yellow - Medium */
      --tier-3: #f87171; /* Red - Hard */
    }

    .board-page {
      position: relative;
      z-index: 10;
      padding: 8rem 2rem 4rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .board-header {
      text-align: center;
      margin-bottom: 2rem;
    }

       /* The Board Container */
    .board-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      /* Enable 3D perspective for the child grid */
      perspective: 1000px; 
    }

    /* The Board Image */
    .board-image {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0.8;
    }

    /* The Interactive Grid Overlay */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(17, 1fr);
      grid-template-rows: repeat(18, 1fr);
      
      /* 3D Transform Properties */
      transform-style: preserve-3d;
      transform-origin: center center;
      
      /* Default slight tilt (Adjust these values to match your photo) */
      /* rotateX tilts top/bottom. rotateY tilts left/right. */
      transform: perspective(1000px) rotateX(5deg) rotateY(0deg); 
    }

    /* Individual Hold Cell */
    .hold-cell {
      position: relative;
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.2s;
    }

    .hold-cell:hover {
      background: rgba(255,255,255,0.1);
    }

    /* Tier Colors (Hidden by default) */
    .hold-cell::after {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 0 5px currentColor;
    }

    /* Show Tiers when class is active */
    .show-tiers .hold-cell::after {
      opacity: 0.9;
    }
    .hold-cell.tier-1::after { background: var(--tier-1); color: var(--tier-1); }
    .hold-cell.tier-2::after { background: var(--tier-2); color: var(--tier-2); }
    .hold-cell.tier-3::after { background: var(--tier-3); color: var(--tier-3); }

    /* Tooltip (Hover Card) */
    .hold-tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 100;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .hold-cell:hover .hold-tooltip {
      opacity: 1;
    }

    .tooltip-img {
      width: 100%;
      height: 100px;
      object-fit: contain;
      background: #222;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .tooltip-info h4 {
      font-size: 1rem;
      color: var(--fg);
      margin-bottom: 0.25rem;
    }
    
    .tooltip-info p {
      font-size: 0.75rem;
      color: var(--fg-muted);
    }

    .tier-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }
    .tier-badge.t-1 { background: rgba(74, 222, 128, 0.2); color: var(--tier-1); }
    .tier-badge.t-2 { background: rgba(250, 204, 21, 0.2); color: var(--tier-2); }
    .tier-badge.t-3 { background: rgba(248, 113, 113, 0.2); color: var(--tier-3); }

    /* Controls */
    .board-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .toggle-switch {
      width: 40px;
      height: 20px;
      background: #333;
      border-radius: 20px;
      position: relative;
      transition: background 0.3s;
    }
    
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .toggle-input:checked + .toggle-switch { background: var(--accent); }
    .toggle-input:checked + .toggle-switch::after { transform: translateX(20px); }
    .toggle-input { display: none; }

    

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      max-width: 200px;
      height: 4px;
      background: #333;
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    /* Modal (Detail View) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      background: var(--card);
      width: 90%;
      max-width: 600px;
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      transform: scale(0.9);
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }

    .modal-img-container {
      background: #111;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .modal-details {
      padding: 1.5rem;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--fg-muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
      line-height: 1;
    }

    .close-btn:hover { color: var(--fg); }

    /* Warning Banner */
    .angle-warning {
      background: rgba(248, 113, 113, 0.1);
      border-left: 3px solid var(--tier-3);
      padding: 0.75rem;
      margin-top: 1rem;
      font-size: 0.875rem;
      display: none; /* Hidden by default */
    }
    
    .angle-warning.visible {
      display: block;
    }

    /* Local Chalk Font Replacement */
    .font-chalk {
      /* Uses system UI fonts that look handwritten/sketchy */
      font-family: 'Segoe Script', 'Bradley Hand ITC', 'Lucida Handwriting', 'Comic Sans MS', cursive;
    }

  </style>
</head>
<body>

  <!-- Backgrounds -->
  <div class="bg-atmosphere" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- Header -->
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a href="index.html" class="logo font-display">BOARD LAB</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html#moves" class="nav-link">Moves</a></li>
          <li><a href="hold-quality.html" class="nav-link">Hold Quality</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="board-page">
    
    <header class="board-header">
      <h1 class="chalk-title font-chalk">Kilter Board Map</h1>
      <p class="chalk-subtitle font-chalk">Visualizing the terrain.</p>
    </header>

    <!-- Interactive Board -->
    <div class="board-wrapper" id="boardWrapper">
      <!-- Background Image -->
      <img src="board-layout.png" alt="Kilter Board Layout" class="board-image">
      
      <!-- Grid Overlay (Generated by JS) -->
      <div class="grid-overlay" id="gridOverlay">
        <!-- Hold cells will be injected here -->
      </div>
    </div>

    <!-- Controls -->
    <div class="board-controls">
      <label class="toggle-group">
        <input type="checkbox" class="toggle-input" id="tierToggle">
        <div class="toggle-switch"></div>
        <span>Show Quality Tiers</span>
		
		<!-- CALIBRATION TOOLS (Delete after finding correct angles) -->
      <div style="display: flex; gap: 2rem; align-items: center; width: 100%; justify-content: center; margin-top: 1rem;">
        <div style="display:flex; flex-direction:column; align-items:center;">
          <label style="font-size: 0.8rem; opacity: 0.7;">Tilt (Top/Bottom)</label>
          <input type="range" min="-20" max="20" value="5" step="0.5" id="calibrateX" style="width: 150px;">
        </div>
        <div style="display:flex; flex-direction:column; align-items:center;">
          <label style="font-size: 0.8rem; opacity: 0.7;">Skew (Left/Right)</label>
          <input type="range" min="-20" max="20" value="0" step="0.5" id="calibrateY" style="width: 150px;">
        </div>
      </div>
      <!-- END CALIBRATION TOOLS -->
		
      </label>

      

  </main>

  <!-- Modal (Popup) -->
  <div class="modal-overlay" id="holdModal">
    <div class="modal-content">
      <div class="modal-images">
        <div class="modal-img-container">
          <img src="" alt="Hold Profile" id="modalProfileImg">
          <span style="position:absolute; bottom:5px; left:10px; font-size:0.7rem; opacity:0.5;">Profile View</span>
        </div>
        <div class="modal-img-container">
          <img src="" alt="Hold Grip" id="modalGripImg">
          <span style="position:absolute; bottom:5px; left:10px; font-size:0.7rem; opacity:0.5;">Grip View</span>
        </div>
      </div>
      <div class="modal-details">
        <div class="modal-header">
          <h3 id="modalTitle" style="font-size: 1.5rem; color: var(--fg);">Hold ID</h3>
          <button class="close-btn" id="closeModal">&times;</button>
        </div>
        <div id="modalMeta">
          <span class="tier-badge" id="modalBadge">Tier 1</span>
          <span style="margin-left: 0.5rem; color: var(--fg-muted);" id="modalType">Jug</span>
        </div>
        <p style="margin-top: 1rem; color: var(--fg-muted);" id="modalDesc">Description goes here.</p>
        
        <div class="angle-warning" id="modalWarning">
          ⚠️ <strong>Warning:</strong> Quality degrades significantly at this angle. Requires high tension.
        </div>
      </div>
    </div>
  </div>

      <script>
    // ============================================
    // 1. DATA STORE
    // ============================================
    const holdsData = {
      // Example Data Entries (Update with your actual data)
      "A18": { 
        tier: 1, 
        type: "Jug", 
        profileImg: "holds/A18-profile.png", 
        gripImg: "holds/A18-grip.png",
        desc: "Finish hold - Large Bucket.",
        angleSensitive: false 
      },
      // Add your other holds here...
    };

    // ============================================
    // 2. GRID GENERATION
    // ============================================
    const gridOverlay = document.getElementById('gridOverlay');
    
    // Columns A through Q (17 columns)
    const columns = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'P', 'Q'];

    // Generate 18 rows (top to bottom: 18 down to 1)
    // Generate 17 cols (left to right)
    
    for (let r = 18; r >= 1; r--) {
      for (let c = 0; c < 17; c++) { // Loop 17 times
        const colLetter = columns[c];
        const holdId = `${colLetter}${r}`;
        
        const cell = document.createElement('div');
        cell.className = 'hold-cell';
        cell.dataset.id = holdId;

        // If we have data for this hold, configure it
        if (holdsData[holdId]) {
          const data = holdsData[holdId];
          cell.classList.add(`tier-${data.tier}`);
          
          // Create Tooltip HTML
          const tooltipHTML = `
            <div class="hold-tooltip">
              <img src="${data.profileImg}" class="tooltip-img" alt="${holdId}" onerror="this.src='https://via.placeholder.com/150x100/222/555?text=No+Image'">
              <div class="tooltip-info">
                <h4>${holdId}</h4>
                <p>${data.type}</p>
                <span class="tier-badge t-${data.tier}">Tier ${data.tier}</span>
              </div>
            </div>
          `;
          cell.innerHTML = tooltipHTML;

          // Click Event Listener
          cell.addEventListener('click', () => openModal(holdId));
        }

        gridOverlay.appendChild(cell);
      }
    }

    // ============================================
    // 3. INTERACTIONS (Modal & Controls)
    // ============================================

    const modal = document.getElementById('holdModal');
    const closeBtn = document.getElementById('closeModal');
    const tierToggle = document.getElementById('tierToggle');
    const boardWrapper = document.getElementById('boardWrapper');

    // Open Modal
    function openModal(id) {
      const data = holdsData[id];
      if (!data) return;

      document.getElementById('modalTitle').textContent = id;
      document.getElementById('modalType').textContent = data.type;
      document.getElementById('modalDesc').textContent = data.desc;
      
      // Images
      document.getElementById('modalProfileImg').src = data.profileImg;
      document.getElementById('modalGripImg').src = data.gripImg;

      // Tier Badge
      const badge = document.getElementById('modalBadge');
      badge.textContent = `Tier ${data.tier}`;
      badge.className = `tier-badge t-${data.tier}`;

      modal.classList.add('active');
    }

    // Close Modal
    function closeModal() {
      modal.classList.remove('active');
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Tier Toggle
    tierToggle.addEventListener('change', () => {
      if (tierToggle.checked) {
        boardWrapper.classList.add('show-tiers');
      } else {
        boardWrapper.classList.remove('show-tiers');
      }
    });

    // ============================================
    // 4. CALIBRATION HELPER (Remove later)
    // ============================================
    const gridOverlay = document.getElementById('gridOverlay'); // Ensure this is targeted
    const calibrateX = document.getElementById('calibrateX');
    const calibrateY = document.getElementById('calibrateY');

    function updateTransform() {
      const xVal = calibrateX.value;
      const yVal = calibrateY.value;
      // Apply the transform with the slider values
      gridOverlay.style.transform = `perspective(1000px) rotateX(${xVal}deg) rotateY(${yVal}deg)`;
    }

    calibrateX.addEventListener('input', updateTransform);
    calibrateY.addEventListener('input', updateTransform);
    
    // Initialize
    updateTransform();

  </script>
</body>
</html>
